  <!-- =========================
       背景音樂控制
  ========================== -->

  <script>

    const bgMusic =
      document.getElementById("bgMusic");

    bgMusic.volume = 0.45;


    /*
      瀏覽器允許時直接播放
    */

    function tryPlayMusic() {

      bgMusic
        .play()
        .catch(() => {
          /*
            Chrome / Safari
            可能禁止未互動自動播放。
            使用者第一次點擊或觸碰後再播放。
          */
        });

    }


    window.addEventListener(
      "load",
      tryPlayMusic
    );


    /*
      第一次點擊網頁後播放
    */

    document.addEventListener(
      "click",
      function startMusic() {

        tryPlayMusic();

        document.removeEventListener(
          "click",
          startMusic
        );

      }
    );


    /*
      手機第一次觸碰後播放
    */

    document.addEventListener(
      "touchstart",
      function startMusicTouch() {

        tryPlayMusic();

        document.removeEventListener(
          "touchstart",
          startMusicTouch
        );

      },
      {
        passive: true
      }
    );

  </script>
