<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080403">

  <title>紅中娛樂城｜官方入口</title>

  <!-- Font Awesome 品牌向量圖示 -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 50% -8%, rgba(165, 34, 16, .46), transparent 34%),
        radial-gradient(circle at 20% 35%, rgba(115, 18, 10, .17), transparent 28%),
        linear-gradient(180deg, #130605 0%, #080505 48%, #030303 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background:
        radial-gradient(circle at 18% 18%, rgba(255, 180, 50, .05), transparent 24%),
        radial-gradient(circle at 82% 32%, rgba(255, 70, 25, .045), transparent 26%);
    }

    .site {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: rgba(0, 0, 0, .06);
      box-shadow: 0 0 70px rgba(0, 0, 0, .38);
    }

    /* HERO */

    .hero {
      position: relative;
      height: 610px;
      overflow: hidden;
      border-bottom-left-radius: 34px;
      border-bottom-right-radius: 34px;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
      display: block;
      animation: heroZoom 10s ease-in-out infinite alternate;
    }

    @keyframes heroZoom {
      from {
        transform: scale(1.025);
      }

      to {
        transform: scale(1.075);
      }
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, .02) 0%,
          rgba(0, 0, 0, .06) 42%,
          rgba(9, 4, 3, .55) 72%,
          #090504 100%
        );
    }

    .hero-glow {
      position: absolute;
      z-index: 1;
      width: 230px;
      height: 230px;
      top: 95px;
      right: -45px;
      border-radius: 50%;
      background: rgba(255, 150, 30, .14);
      filter: blur(55px);
      animation: glowFloat 5s ease-in-out infinite;
    }

    @keyframes glowFloat {
      0%, 100% {
        transform: translateY(0);
        opacity: .55;
      }

      50% {
        transform: translateY(20px);
        opacity: .9;
      }
    }

    .hero-content {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: 34px;
      padding: 0 22px;
      text-align: center;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 16px;
      margin-bottom: 14px;

      border-radius: 999px;
      border: 1px solid rgba(255, 205, 92, .35);

      background: rgba(12, 7, 5, .60);
      backdrop-filter: blur(12px);

      color: #ffd878;
      font-size: 12px;
      letter-spacing: 3px;

      box-shadow:
        inset 0 1px rgba(255, 255, 255, .06),
        0 8px 25px rgba(0, 0, 0, .2);
    }

    .brand-chip::before {
      content: "中";

      display: grid;
      place-items: center;

      width: 23px;
      height: 23px;

      border-radius: 7px;

      background:
        linear-gradient(145deg, #ffd56a, #ad4f0b);

      color: #3a0c07;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0;
    }

    h1 {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: 3px;

      background:
        linear-gradient(
          180deg,
          #fff7ce 0%,
          #ffd45e 40%,
          #b55a16 100%
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      filter:
        drop-shadow(0 8px 22px rgba(0, 0, 0, .38));
    }

    .slogan {
      margin-top: 12px;
      color: #f5ead6;
      font-size: 16px;
      line-height: 1.7;
      letter-spacing: 2px;
    }

    /* CONTENT */

    .content {
      padding: 26px 20px 115px;
    }

    .section {
      margin-top: 22px;
      animation: fadeUp .7s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 14px;

      color: #e3b45a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .section-title::before {
      content: "";
      width: 28px;
      height: 2px;

      background:
        linear-gradient(
          90deg,
          #f5bd45,
          transparent
        );
    }

    /* ABOUT */

    .about {
      padding: 20px;

      border-radius: 22px;
      border: 1px solid rgba(255, 199, 77, .12);

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, .06),
          rgba(255, 255, 255, .02)
        );

      backdrop-filter: blur(10px);

      box-shadow:
        0 14px 35px rgba(0, 0, 0, .22);

      color: #c7bbb0;
      font-size: 14px;
      line-height: 1.9;
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;

      margin-top: 14px;
    }

    .highlight {
      padding: 16px 8px;
      text-align: center;

      border-radius: 18px;
      border: 1px solid rgba(255, 197, 74, .1);

      background:
        rgba(255, 255, 255, .035);
    }

    .highlight strong {
      display: block;
      margin-bottom: 5px;

      color: #ffd76f;
      font-size: 16px;
    }

    .highlight span {
      color: #8f837d;
      font-size: 11px;
    }

    /* LINKS */

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      position: relative;

      display: flex;
      align-items: center;

      min-height: 76px;
      padding: 0 18px;

      color: white;
      text-decoration: none;

      border-radius: 20px;
      border: 1px solid rgba(255, 198, 74, .15);

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, .065),
          rgba(255, 255, 255, .022)
        );

      backdrop-filter: blur(10px);

      box-shadow:
        0 14px 34px rgba(0, 0, 0, .28),
        inset 0 1px rgba(255, 255, 255, .05);

      transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
    }

    .link:hover {
      transform: translateY(-3px);

      border-color:
        rgba(255, 199, 71, .5);

      box-shadow:
        0 16px 38px rgba(125, 35, 10, .22);
    }

    .link:active {
      transform: scale(.98);
    }

    .main-link {
      background:
        linear-gradient(
          135deg,
          rgba(124, 23, 11, .97),
          rgba(48, 9, 6, .95)
        );

      border-color:
        rgba(255, 188, 68, .42);
    }

    /* ICON */

    .icon {
      width: 48px;
      height: 48px;

      flex: 0 0 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-right: 14px;

      border-radius: 15px;

      overflow: hidden;

      box-shadow:
        0 7px 18px rgba(0, 0, 0, .25);

      font-size: 13px;
      font-weight: 900;
    }

    .hongzhong-icon {
      color: #411006;

      background:
        linear-gradient(
          145deg,
          #ffe07a 0%,
          #efac2d 50%,
          #a94f0c 100%
        );

      border:
        1px solid rgba(255, 225, 130, .55);

      font-size: 15px;
    }

    /* LINE */

    .line-icon {
      background: #06C755;
      color: white;
    }

    .line-icon i {
      font-size: 30px;
      line-height: 1;
    }

    /* Instagram */

    .instagram-icon {
      background:
        radial-gradient(
          circle at 30% 100%,
          #ffd600 0%,
          #ff7a00 22%,
          #ff0169 48%,
          #d300c5 72%,
          #7638fa 100%
        );

      color: white;
    }

    .instagram-icon i {
      font-size: 29px;
      line-height: 1;
    }

    /* Threads */

    .threads-icon {
      background: #ffffff;
      color: #090909;
    }

    .threads-icon i {
      font-size: 29px;
      line-height: 1;
    }

    /* LINK TEXT */

    .link-copy {
      min-width: 0;
      text-align: left;
    }

    .link-title {
      display: block;

      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .link-subtitle {
      display: block;

      margin-top: 4px;

      color: #8e817b;
      font-size: 11px;
    }

    .arrow {
      margin-left: auto;
      padding-left: 10px;

      color: #dda93f;
      font-size: 24px;
      line-height: 1;
    }

    /* FOOTER */

    .footer {
      margin-top: 35px;

      text-align: center;

      color: #514843;
      font-size: 11px;
      line-height: 1.8;
    }

    .footer strong {
      color: #92703b;
      font-weight: 600;
    }

    /* BOTTOM CTA */

    .floating-contact {
      position: fixed;

      z-index: 30;

      left: 50%;
      bottom: 14px;

      transform: translateX(-50%);

      width: calc(100% - 28px);
      max-width: 492px;

      display: flex;
      gap: 10px;

      padding: 10px;

      border-radius: 20px;
      border: 1px solid rgba(255, 192, 65, .16);

      background:
        rgba(8, 5, 4, .84);

      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, .42);
    }

    .floating-contact a {
      flex: 1;

      min-height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      border-radius: 14px;

      text-decoration: none;

      font-size: 14px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .site-btn {
      color: #ffd876;

      background:
        linear-gradient(
          135deg,
          #842113,
          #3d0d08
        );

      border:
        1px solid rgba(255, 200, 76, .35);
    }

    .line-btn {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          #06C755,
          #049d43
        );

      border:
        1px solid rgba(255, 255, 255, .12);
    }

    .line-btn i {
      font-size: 19px;
    }

    /* MOBILE */

    @media (max-width: 420px) {
      .hero {
        height: 560px;
      }

      h1 {
        font-size: 34px;
      }

      .content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .link {
        min-height: 74px;

        padding-left: 14px;
        padding-right: 14px;
      }

      .icon {
        width: 46px;
        height: 46px;
        flex-basis: 46px;

        margin-right: 13px;
      }

      .line-icon i {
        font-size: 28px;
      }

      .instagram-icon i,
      .threads-icon i {
        font-size: 27px;
      }

      .highlights {
        gap: 8px;
      }
    }
  </style>
</head>
