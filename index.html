<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>紅中娛樂城｜官方連結</title>

  <meta name="description" content="紅中娛樂城官方連結">
  <meta name="theme-color" content="#080403">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(115, 18, 8, 0.28),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #100403 0%,
          #080403 38%,
          #050505 100%
        );

      padding-bottom: 110px;
    }

    a {
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       主容器
    ========================= */

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    /* =========================
       頂部圖片
    ========================= */

    .hero {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 0 0 28px 28px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        0 0 45px rgba(173, 67, 10, 0.13);
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 45%;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(7, 3, 2, 0.96)
        );

      pointer-events: none;
    }

    .hero-badge {
      position: absolute;
      z-index: 2;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);

      padding: 7px 18px;

      color: #f3c65b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;

      border: 1px solid rgba(236, 178, 54, 0.65);
      border-radius: 999px;

      background: rgba(5, 5, 5, 0.72);
      backdrop-filter: blur(10px);

      box-shadow:
        0 0 20px rgba(217, 144, 27, 0.18);
    }

    /* =========================
       標題
    ========================= */

    .intro {
      text-align: center;
      padding: 25px 10px 10px;
    }

    .intro h1 {
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 3px;

      background:
        linear-gradient(
          180deg,
          #fff0a8 0%,
          #f8c650 45%,
          #b86d13 100%
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;

      filter:
        drop-shadow(0 3px 12px rgba(227, 142, 25, 0.25));
    }

    .slogan {
      margin-top: 10px;

      color: #e5d4b2;
      font-size: 14px;
      letter-spacing: 1.5px;
    }

    .divider {
      width: 52px;
      height: 2px;

      margin: 20px auto;

      background:
        linear-gradient(
          90deg,
          transparent,
          #e6ad38,
          transparent
        );
    }

    .welcome {
      color: #b7aaa2;
      font-size: 13px;
      line-height: 1.8;
    }

    /* =========================
       OFFICIAL LINKS
    ========================= */

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-top: 20px;
      margin-bottom: 14px;

      color: #dba83d;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .section-title::before {
      content: "";
      width: 28px;
      height: 2px;

      background:
        linear-gradient(
          90deg,
          #f2bd47,
          #8d5010
        );
    }

    /* =========================
       連結按鈕
    ========================= */

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      position: relative;

      display: flex;
      align-items: center;

      min-height: 76px;
      padding: 13px 18px;

      overflow: hidden;

      border: 1px solid rgba(202, 148, 48, 0.25);
      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          rgba(26, 23, 21, 0.96),
          rgba(9, 9, 9, 0.98)
        );

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.03),
        0 10px 30px rgba(0, 0, 0, 0.18);

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .link:active {
      transform: scale(0.98);
    }

    .link:hover {
      border-color: rgba(235, 177, 58, 0.55);

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.28),
        0 0 25px rgba(205, 119, 20, 0.08);
    }

    /* 平台網址特殊紅色 */

    .link.main-link {
      border-color: rgba(255, 177, 51, 0.58);

      background:
        linear-gradient(
          135deg,
          #761b0e 0%,
          #501006 100%
        );

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 8px 25px rgba(113, 18, 5, 0.22);
    }

    /* =========================
       ICON
    ========================= */

    .icon {
      width: 48px;
      height: 48px;

      flex: 0 0 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-right: 14px;

      border-radius: 14px;

      overflow: hidden;
    }

    .icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* 紅中 */

    .icon-hz {
      color: #401300;
      font-size: 17px;
      font-weight: 900;

      background:
        linear-gradient(
          145deg,
          #ffd867,
          #e99a20
        );

      border: 1px solid rgba(255, 218, 112, 0.7);

      box-shadow:
        0 4px 15px rgba(241, 158, 27, 0.25);
    }

    /* LINE */

    .icon-line {
      background: #06c755;
    }

    /* IG */

    .icon-ig {
      background:
        radial-gradient(
          circle at 30% 110%,
          #ffd600 0%,
          #ff7a00 30%,
          #ff0169 55%,
          #d300c5 78%,
          #7638fa 100%
        );
    }

    /* Threads */

    .icon-threads {
      background: #ffffff;
    }

    /* =========================
       文字
    ========================= */

    .link-text {
      min-width: 0;
      flex: 1;
    }

    .link-title {
      display: block;

      color: #ffffff;

      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .link-subtitle {
      display: block;

      margin-top: 4px;

      color: #938985;

      font-size: 11px;
      line-height: 1.35;
    }

    /* 推廣碼 */

    .promo-code {
      color: #e8bd5d;
      font-weight: 650;
    }

    .promo-code strong {
      color: #ffd45c;

      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;

      text-shadow:
        0 0 10px rgba(255, 200, 66, 0.38);
    }

    /* 箭頭 */

    .arrow {
      margin-left: 10px;

      color: #dca72e;

      font-size: 22px;
      font-weight: 400;

      transition: transform 0.18s ease;
    }

    .link:hover .arrow {
      transform: translateX(3px);
    }

    /* =========================
       Footer
    ========================= */

    footer {
      padding: 34px 10px 20px;

      text-align: center;

      color: #625853;

      font-size: 10px;
      line-height: 1.8;
    }

    footer strong {
      color: #c99735;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* =========================
       固定立即註冊
    ========================= */

    .fixed-register {
      position: fixed;

      z-index: 1000;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      width: calc(100% - 32px);
      max-width: 488px;
    }

    .register-btn {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 58px;

      color: #2c1300;

      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;

      border: 1px solid #ffda72;
      border-radius: 18px;

      background:
        linear-gradient(
          180deg,
          #ffd96a 0%,
          #e79b23 100%
        );

      box-shadow:
        0 10px 35px rgba(227, 143, 24, 0.28),
        0 0 25px rgba(255, 184, 45, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);

      transition: transform 0.15s ease;
    }

    .register-btn:active {
      transform: scale(0.98);
    }

    .register-btn::before {
      content: "";

      position: absolute;
      top: 0;
      left: 12%;

      width: 40%;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.9),
          transparent
        );
    }

    /* =========================
       手機
    ========================= */

    @media (max-width: 480px) {

      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .intro h1 {
        font-size: 27px;
      }

      .link {
        min-height: 74px;
        padding: 12px 15px;
      }

      .icon {
        width: 46px;
        height: 46px;
        flex-basis: 46px;
      }

      .link-title {
        font-size: 15px;
      }

      .fixed-register {
        width: calc(100% - 24px);
        bottom: 12px;
      }
    }

  </style>
</head>
