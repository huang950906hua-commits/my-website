<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050403">

  <title>紅中娛樂城｜官方連結</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(117, 21, 8, 0.30),
          transparent 36%
        ),
        linear-gradient(
          180deg,
          #100503 0%,
          #070403 42%,
          #020202 100%
        );

      padding-bottom: 110px;
    }


    /* =========================
       整體容器
    ========================= */

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 14px 40px;
    }


    /* =========================
       上方主視覺
    ========================= */

    .hero {
      position: relative;
      width: 100%;
      height: 255px;

      overflow: hidden;

      border-radius: 0 0 24px 24px;

      border-left: 1px solid rgba(231, 171, 45, 0.22);
      border-right: 1px solid rgba(231, 171, 45, 0.22);
      border-bottom: 1px solid rgba(231, 171, 45, 0.28);

      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.45),
        0 0 30px rgba(177, 44, 13, 0.08);

      background: #130604;
    }

    .hero img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      /* 讓吉祥物重點比較容易留在畫面 */
      object-position: center 45%;

      display: block;
    }

    .hero::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          transparent 40%,
          rgba(5, 2, 1, 0.12) 60%,
          rgba(5, 2, 1, 0.92) 100%
        );

      pointer-events: none;
    }


    /* =========================
       品牌區
    ========================= */

    .brand {
      text-align: center;
      margin-top: -16px;

      position: relative;
      z-index: 5;
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 138px;

      padding: 7px 18px;

      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          rgba(25, 16, 8, 0.96),
          rgba(8, 6, 4, 0.96)
        );

      border: 1px solid rgba(224, 166, 47, 0.60);

      color: #e9b843;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 3px;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .brand h1 {
      margin-top: 15px;

      font-size: 29px;
      line-height: 1.2;

      font-weight: 900;

      letter-spacing: 3px;

      background:
        linear-gradient(
          180deg,
          #fff1a6 0%,
          #eebd46 38%,
          #c98617 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow:
        0 4px 20px rgba(220, 134, 19, 0.12);
    }

    .slogan {
      margin-top: 10px;

      color: #f4dfb3;

      font-size: 14px;
      font-weight: 600;

      letter-spacing: 1.5px;
    }


    /* =========================
       小裝飾
    ========================= */

    .gold-divider {
      width: 46px;
      height: 2px;

      margin: 20px auto;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #d89a27,
          #ffe19a,
          #d89a27,
          transparent
        );

      box-shadow:
        0 0 12px rgba(225, 167, 48, 0.25);
    }


    /* =========================
       說明文字
    ========================= */

    .intro {
      text-align: center;

      margin-bottom: 28px;

      color: #bdb5ac;

      font-size: 13px;

      line-height: 1.8;

      letter-spacing: 0.5px;
    }

    .intro strong {
      color: #ead7b0;
      font-weight: 700;
    }


    /* =========================
       OFFICIAL LINKS
    ========================= */

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 12px;

      color: #dca934;

      font-size: 12px;
      font-weight: 900;

      letter-spacing: 2px;
    }

    .section-title::before {
      content: "";

      width: 28px;
      height: 2px;

      background:
        linear-gradient(
          90deg,
          #e2a82f,
          rgba(226, 168, 47, 0)
        );
    }


    /* =========================
       連結按鈕
    ========================= */

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      position: relative;

      display: flex;
      align-items: center;

      width: 100%;
      min-height: 76px;

      padding: 12px 48px 12px 16px;

      text-decoration: none;

      color: #ffffff;

      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          rgba(22, 21, 20, 0.98),
          rgba(9, 9, 9, 0.98)
        );

      border: 1px solid rgba(201, 146, 35, 0.30);

      box-shadow:
        0 8px 26px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }

    .link:active {
      transform: scale(0.985);
    }

    .link:hover {
      border-color: rgba(229, 174, 55, 0.62);
    }


    /* 平台網址特別版 */

    .link.platform {
      background:
        linear-gradient(
          135deg,
          #76170d 0%,
          #4d0e08 100%
        );

      border: 1px solid rgba(235, 166, 34, 0.70);

      box-shadow:
        0 9px 30px rgba(113, 18, 8, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }


    /* =========================
       Logo 共用設定
    ========================= */

    .icon {
      width: 48px;
      height: 48px;

      flex: 0 0 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-right: 14px;

      border-radius: 14px;

      overflow: hidden;
    }

    .icon svg {
      width: 100%;
      height: 100%;

      display: block;
    }


    /* =========================
       紅中平台 Icon
    ========================= */

    .hongzhong-icon {
      color: #5b2500;

      font-size: 17px;
      font-weight: 900;

      background:
        linear-gradient(
          145deg,
          #ffe073,
          #d78c17
        );

      border: 1px solid rgba(255, 223, 117, 0.65);

      box-shadow:
        0 5px 18px rgba(228, 155, 28, 0.20);
    }


    /* =========================
       LINE 官方風格
    ========================= */

    .line-icon {
      background: #06C755;

      box-shadow:
        0 5px 20px rgba(6, 199, 85, 0.20);
    }


    /* =========================
       Instagram
    ========================= */

    .instagram-icon {
      background: transparent;

      box-shadow:
        0 5px 20px rgba(255, 0, 105, 0.16);
    }


    /* =========================
       Threads
    ========================= */

    .threads-icon {
      background: #ffffff;

      box-shadow:
        0 5px 20px rgba(255, 255, 255, 0.09);
    }


    /* =========================
       文字
    ========================= */

    .link-text {
      min-width: 0;

      display: flex;
      flex-direction: column;

      gap: 4px;
    }

    .link-title {
      color: #ffffff;

      font-size: 16px;
      font-weight: 850;

      letter-spacing: 0.2px;
    }

    .link-subtitle {
      color: #918b84;

      font-size: 11px;

      line-height: 1.4;

      letter-spacing: 0.15px;
    }

    .platform .link-subtitle {
      color: #dfb89e;
    }


    /* 推廣碼 */

    .promo-code {
      display: inline-block;

      margin-top: 2px;

      color: #ffd56c;

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 0.4px;
    }


    /* 箭頭 */

    .arrow {
      position: absolute;

      right: 18px;
      top: 50%;

      transform: translateY(-50%);

      color: #e6ae30;

      font-size: 22px;
      font-weight: 400;
    }


    /* =========================
       Footer
    ========================= */

    footer {
      text-align: center;

      margin-top: 34px;

      padding-bottom: 8px;

      color: #6f6962;

      font-size: 10px;

      line-height: 1.8;

      letter-spacing: 0.5px;
    }

    footer strong {
      color: #c7952e;
      font-weight: 700;
    }


    /* =========================
       固定立即註冊
    ========================= */

    .fixed-register {
      position: fixed;

      left: 50%;
      bottom: calc(14px + env(safe-area-inset-bottom));

      transform: translateX(-50%);

      z-index: 999;

      width: calc(100% - 28px);
      max-width: 492px;

      height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      text-decoration: none;

      color: #351500;

      font-size: 17px;
      font-weight: 900;

      letter-spacing: 2px;

      background:
        linear-gradient(
          135deg,
          #ffe27c 0%,
          #d9941d 46%,
          #ffcc55 100%
        );

      border: 1px solid rgba(255, 235, 169, 0.70);

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.55),
        0 4px 22px rgba(221, 147, 27, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.50);

      transition:
        transform 0.18s ease,
        filter 0.18s ease;
    }

    .fixed-register:active {
      transform:
        translateX(-50%)
        scale(0.98);
    }

    .fixed-register:hover {
      filter: brightness(1.05);
    }


    /* =========================
       手機
    ========================= */

    @media (max-width: 420px) {

      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .hero {
        height: 235px;
      }

      .brand h1 {
        font-size: 27px;
      }

      .link {
        min-height: 74px;
      }

      .icon {
        width: 46px;
        height: 46px;

        flex-basis: 46px;
      }

      .link-title {
        font-size: 15px;
      }
    }

  </style>
</head>
