<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>紅中娛樂城</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, #45100c 0%, #130504 35%, #050505 70%);
      color: #fff;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 60px;
      position: relative;
      overflow: hidden;
    }

    /* 頂部圖片 */

    .hero {
      position: relative;
      width: 100%;
      height: 500px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 48%;
      display: block;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.02) 35%,
          rgba(5,5,5,0.25) 65%,
          #070505 100%
        );
    }

    /* 品牌區 */

    .content {
      position: relative;
      z-index: 2;
      margin-top: -45px;
      padding: 0 22px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 7px 17px;
      border: 1px solid rgba(255, 198, 74, .45);
      border-radius: 100px;
      color: #ffd574;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(10px);
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(
        180deg,
        #fff3b5 0%,
        #ffd35a 40%,
        #b76a13 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 12px rgba(255, 150, 0, .25));
    }

    .slogan {
      margin-top: 10px;
      color: #f1e8d7;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .line {
      width: 45px;
      height: 2px;
      margin: 22px auto;
      background: linear-gradient(90deg, transparent, #ffc94c, transparent);
    }

    .intro {
      font-size: 14px;
      line-height: 1.9;
      color: #aaa;
      margin-bottom: 28px;
    }

    /* 連結 */

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 68px;
      padding: 0 20px;
      border-radius: 17px;
      text-decoration: none;
      color: white;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.08),
          rgba(255,255,255,.025)
        );
      border: 1px solid rgba(255, 198, 74, .18);
      box-shadow:
        0 8px 30px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
      transition: .25s ease;
    }

    .link:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 199, 71, .7);
      box-shadow: 0 10px 35px rgba(255, 120, 0, .12);
    }

    .icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      margin-right: 15px;
      font-weight: 900;
      font-size: 14px;
      background: linear-gradient(145deg, #4a130e, #170807);
      border: 1px solid rgba(255, 198, 74, .25);
      color: #ffd45e;
    }

    .link-text {
      text-align: left;
    }

    .link-title {
      display: block;
      font-weight: 700;
      font-size: 16px;
    }

    .link-subtitle {
      display: block;
      color: #888;
      font-size: 11px;
      margin-top: 3px;
    }

    .arrow {
      margin-left: auto;
      color: #d9aa4e;
      font-size: 20px;
    }

    /* 主要按鈕 */

    .main-link {
      background:
        linear-gradient(135deg, #6d160d, #2b0805);
      border: 1px solid #b96d24;
      box-shadow:
        0 8px 30px rgba(160, 35, 15, .22),
        inset 0 1px rgba(255, 220, 130, .15);
    }

    .main-link .icon {
      background: linear-gradient(145deg, #ffc95b, #a7540d);
      color: #3a0904;
    }

    /* Footer */

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 0 20px;
      color: #555;
      font-size: 11px;
      line-height: 1.8;
    }

    footer strong {
      color: #92703d;
      font-weight: 500;
    }

    @media (max-width: 420px) {
      .hero {
        height: 440px;
      }

      h1 {
        font-size: 30px;
      }

      .content {
        padding: 0 17px;
      }
    }
  </style>
</head>

        <a class="link"

    <footer>

  </main>

</body>
</html>
